services:
  tesla-stock-watch:
    build: .
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: tesla-stock-watch
    restart: unless-stopped
    shm_size: "1gb"
    cap_add:
      - SYS_ADMIN
    env_file:
      - path: .env.docker
        required: true
      - path: .env.secrets
        required: false
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/strict"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${NOVNC_BIND:-127.0.0.1}:${NOVNC_PORT:-6080}:6080"
    volumes:
      - tesla-stock-chrome-profile:/data/chrome-profile
      - tesla-stock-state:/data/tesla-state

volumes:
  tesla-stock-chrome-profile:
  tesla-stock-state:
